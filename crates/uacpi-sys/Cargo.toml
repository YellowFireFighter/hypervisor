[package]
name = "uacpi-sys"
description = "Raw bindings to the uACPI ACPI implementation, built from the pinned submodule"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Declares that this crate is the one place uACPI is built, so two copies of the
# static library can never end up in one link.
links = "uacpi"

# The generated bindings carry uACPI's C comments over as Rust doc comments,
# and rustdoc would compile their C fragments as Rust doctests. Nothing in this
# crate is a doc example, so there is nothing for doctests to run.
[lib]
doctest = false

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true }

[lints]
workspace = true
