# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "hv-core"
description = "Hypervisor image for pulzar, loaded and entered by hv-loader"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

[[bin]]
name = "hv-core"
path = "src/main.rs"
test = false
bench = false

[dependencies]
acpi = { workspace = true }
apic = { workspace = true }
clock = { workspace = true }
cpu = { workspace = true }
descriptors = { workspace = true }
emulate = { workspace = true }
exits = { workspace = true }
handoff = { workspace = true }
ipi = { workspace = true }
log = { workspace = true }
npt = { workspace = true }
paging = { workspace = true }
partition = { workspace = true }
pci = { workspace = true }
portal = { workspace = true }
probe = { workspace = true }
processor = { workspace = true }
serial = { workspace = true }
snapshot = { workspace = true }
# The boot screen, animated here while the host comes up.
splash = { workspace = true }
spin = { workspace = true }
svm = { workspace = true }
talc = { workspace = true }
thiserror = { workspace = true }
# uACPI's host: this image is the only thing in the workspace that can answer
# what uACPI needs of a machine, so it defines every one of those callbacks.
uacpi-sys = { workspace = true }
uefi-raw = { workspace = true }
vcpu = { workspace = true }
# The Intel VMX definitions and the executable VMX layer, pulled in only by
# the vmx-selftest feature below.
vmx = { workspace = true, optional = true }
vmcs = { workspace = true, optional = true }
vlapic = { workspace = true }
x86_64 = { workspace = true }

[features]
# Strips every log record out of this image, and out of every crate it is built
# with: `log` is compiled once for the build, so this reaches all of them.
#
# For a real machine. A byte down a 16550 costs 260 µs with interrupts held off
# and a machine-wide lock taken, a board with a serial header has a working one
# behind it whether or not a cable is plugged in, and a per-exit diagnostic then
# costs more wall clock than the guest it is describing. Everything that records
# state in memory — the exit census's counters, each controller's own — is
# unaffected and still readable from a debugger.
quiet = ["serial/quiet"]

# The logging screen backend, for machines with neither a debug console nor a
# UART header. Compiles the backend and its glyph tables into this image; off
# by default because a screen is a guest-facing device once the firmware guest
# starts drawing.
efifb = ["serial/efifb"]

# The boot screen: the mark, its shine, the loading bar and the spinner, drawn
# onto the frame buffer while the host comes up and held until the bar fills.
# Draws on the same pixels as `efifb`, so the two cannot be built together.
splash = []

# A one-shot check, on an Intel processor, that this build can enter VMX
# operation and that the VMCS instruction wrappers round-trip. Runs early in
# bring-up and then halts, because the rest of pulzar is AMD SVM and cannot
# proceed on an Intel machine. For bringing the unverified Intel path up on
# real hardware; off in every ordinary build.
vmx-selftest = ["dep:vmx", "dep:vmcs"]

[lints]
workspace = true
